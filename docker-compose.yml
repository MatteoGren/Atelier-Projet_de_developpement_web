networks:
  nrv.net:
    driver: bridge

services:
  # service api.nrv : api pour la prise de rdv
  #
  api.nrv:
    build:
      context: build
      dockerfile: 8.5-cli.Dockerfile
    restart: unless-stopped
    ports:
      - '31001:80'
    volumes:
      - ./app:/var/php
      - ./nrv.env:/var/nrv.env:ro
    working_dir: /var/php
    networks:
      - nrv.net
    depends_on:
      - nrv.db

    command: sh -c "composer install && php -S 0.0.0.0:80 -t /var/php/public"


  nrv.db:
    image: 'postgres:18.6'
    restart: unless-stopped
    env_file: ./nrv.env
    # pas de port publié : seuls api.nrv et adminer y accèdent via le réseau nrv.net
    networks:
      - nrv.net
    volumes:
      - ./app/sql:/var/sql


  # service front.nrv : pages HTML/CSS/JS servies telles quelles
  front.nrv:
    image: 'nginx:1.27-alpine'
    restart: unless-stopped
    ports:
      - '31000:80'
    volumes:
      - ./front:/usr/share/nginx/html:ro
    networks:
      - nrv.net
    depends_on:
      - api.nrv


  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - '31002:8080'
    networks:
      - nrv.net
