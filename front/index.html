<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NRV.net - Programme du festival</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/handlebars@4.7.8/dist/handlebars.min.js"></script>
    <script type="module" src="js/main.js"></script>
    <script type="module" src="js/auth-header.js"></script>
</head>
<body>
    <header class="entete">
        <h1>Nancy Rock Vibration</h1>
        <p>Programme du festival</p>
    </header>

    <main>
        <nav class="Navigation">
            <a href="index.html">Programme</a>
            <a href="panier.html">Panier</a>
    
            <a href="auth.html" id="lien-connexion">> Connexion</a>
                <span id="zone-utilisateur" style="display: none;">
                    <span id="nom-utilisateur" style="color: #c85a17;"></span>
                    <a href="#" id="btn-deconnexion" style="text-decoration: underline; color: #000; margin-left: 8px;">> Déconnexion</a>
            </span>
        </nav>
        <section>
            <h2 id="titre-spectacles">Accueil / programme</h2>

            <form id="filtres" class="filtres" aria-labelledby="titre-filtres">
                <h3 id="titre-filtres">Filtrer les spectacles</h3>
                <div class="champ">
                    <label for="filtre-date">Date</label>
                    <select id="filtre-date" name="date">
                        <option value="">Toutes les dates</option>
                    </select>
                </div>
                <div class="champ">
                    <label for="filtre-style">Style de musique</label>
                    <select id="filtre-style" name="style">
                        <option value="">Tous les styles</option>
                    </select>
                </div>
                <button type="submit" class="btn-principal">Appliquer les filtres</button>
                <button type="reset" class="btn-secondaire">Réinitialiser</button>
            </form>

            <p id="message" class="message" role="status">Chargement des spectacles...</p>
            <div id="liste-spectacles" class="liste-spectacles"></div>

            <script id="tpl-spectacle" type="text/x-handlebars-template">
                {{#each spectacles}}
                <article class="carte-spectacle">
                    <img src="{{image}}" alt="{{titre}}" loading="lazy">
                    <div class="infos">
                        <h3><a class="lien-titre" href="{{lienDetail}}">{{titre}}</a></h3>
                        <p><time class="date" datetime="{{date}}T{{horaire}}">{{dateFormatee}} à {{horaire}}</time></p>
                    </div>
                </article>
                {{/each}}
            </script>
        </section>
    </main>

    <footer class="pieddepage">
        <p>NRV.net - Billetterie du festival</p>
    </footer>
</body>
</html>
