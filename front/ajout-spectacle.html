<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NRV - Créer un Spectacle</title>
    <!-- Lien vers ton CSS compilé depuis le dossier scss -->
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <main class="container">
        <h1>Ajouter un nouveau spectacle</h1>

        <div id="message" class="message" style="display: none;"></div>

        <form id="form-spectacle">
            <div class="form-group">
                <label for="soiree_id">ID de la Soirée :</label>
                <input type="text" id="soiree_id" name="soiree_id" required placeholder="ex: UUID de la soirée">
            </div>

            <div class="form-group">
                <label for="titre">Titre du spectacle :</label>
                <input type="text" id="titre" name="titre" required placeholder="ex: Concert Rock Live">
            </div>

            <div class="form-group">
                <label for="artistes">Artistes :</label>
                <input type="text" id="artistes" name="artistes" required placeholder="ex: Blue Meurthe, Mama Delta">
            </div>

            <div class="form-group">
                <label for="style">Style musical :</label>
                <input type="text" id="style" name="style" required placeholder="ex: Rock, Jazz, Métal">
            </div>

            <div class="form-group">
                <label for="horaire">Horaire :</label>
                <input type="datetime-local" id="horaire" name="horaire" required>
            </div>

            <div class="form-group">
                <label for="description">Description :</label>
                <textarea id="description" name="description" rows="4"></textarea>
            </div>

            <div class="form-group">
                <label for="images">Images (séparées par un point-virgule ';') :</label>
                <input type="text" id="images" name="images" placeholder="img/concert1.jpg;img/concert2.jpg">
            </div>

            <div class="form-group">
                <label for="chemin_video">Chemin de la vidéo :</label>
                <input type="text" id="chemin_video" name="chemin_video" placeholder="vid/teaser.mp4">
            </div>

            <button type="submit" class="btn-submit">Créer le spectacle</button>
        </form>
    </main>

    <script src="js/app.js"></script>
</body>
</html>
