<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NRV.net - Votre panier</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/handlebars@4.7.8/dist/handlebars.min.js"></script>
    <script type="module" src="js/panier.js"></script>
    <script type="module" src="js/auth-header.js"></script>
</head>

<body>
    <header class="entete">
        <h1>Nancy Rock Vibration</h1>
        <p>Votre panier</p>
    </header>

    <main>
        <nav class="Navigation" id="nav"></nav>
        <section id="contenu-panier"></section>

        <script id="tpl-panier" type="text/x-handlebars-template">
            <h2>Votre panier</h2>
        
            {{#if vide}}
                <p>Votre panier est vide.</p>
            {{else}}
        
            <div class="panier-liste">
        
                <section class="panier-lignes">
                    {{#each lignes}}
                    <article class="ligne-panier">
        
                        <div class="infos-soiree">
                            <h3><a href="/soiree.html?id={{soireeId}}">{{nom}}</a></h3>
                            <p class="date">{{date}}</p>
                            <p class="lieu">{{lieu}}</p>
        
                            <p class="prix-unitaires">
                                Prix unitaire : normal {{prixNormal}} •
                                réduit {{prixReduit}}
                            </p>
        
                            <button type="button" class="btn-retirer" data-retirer="{{soireeId}}">Retirer du panier</button>
                        </div>
        
                        <div class="tarifs-panier">
        
                            <div class="tarif-panier">
                                <label>Normal</label>
                                <div class="quantite" data-soiree-id="{{soireeId}}" data-type="nbNormal">
                                    <button type="button" class="moins">-</button>
                                    <input type="number" min="0" value="{{nbNormal}}" aria-label="Nombre de billets normaux">
                                    <button type="button" class="plus">+</button>
                                </div>
                            </div>
        
                            <div class="tarif-panier">
                                <label>Réduit</label>
                                <div class="quantite" data-soiree-id="{{soireeId}}" data-type="nbReduit">
                                    <button type="button" class="moins">-</button>
                                    <input type="number" min="0" value="{{nbReduit}}">
                                    <button type="button" class="plus">+</button>
                                </div>
                            </div>
        
                            <p class="sous-total">
                                Sous-total : {{sousTotal}}
                            </p>
                        </div>
        
                    </article>
                    {{/each}}
        
                    <a id="btn-vider-panier">Vider le panier </a>
                </section>
        
                <aside class="recapitulatif-panier">
                    <h3>Montant total</h3>
        
                    <p>{{nbBillets}} billets • {{nbSoirees}} soirées</p>
                    <!-- <p>Sous-total : {{sousTotalGeneral}}</p> -->
        
                    <p class="total">Total : {{total}}</p>
        
                    <button type="button" id="btn-valider" class="btn-principal">Valider</button>
                    <p id="msg-validation" class="message" role="alert"></p>
        
                    <p class="note-paiement">Connexion / inscription obligatoire pour poursuivre.</p>
                </aside>
        
            </div>
            {{/if}}
        </script>
    </main>

    <footer class="pieddepage">
        <p>NRV.net - Billetterie du festival</p>
    </footer>
</body>

</html>
