<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NRV.net - Votre panier</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/handlebars@4.7.8/dist/handlebars.min.js"></script>
    <script type="module" src="js/panier.js"></script>
</head>

<body>
    <header class="entete">
        <h1>Nancy Rock Vibration</h1>
        <p>Votre panier</p>
    </header>

    <main>
        <nav aria-label="Navigation">
            <a href="index.html">Retour au programme</a>
        </nav>
        <section id="contenu-panier" aria-live="polite"></section>

        <script id="tpl-panier" type="text/x-handlebars-template">
            {{#if vide}}
                <p>Votre panier est vide.</p>
            {{else}}
                {{#each lignes}}
                <article class="ligne-panier">
                    <h3 class="nom">{{nom}}</h3>
                    <p class="date">{{date}}</p>
                    <p class="billets">{{nbNormal}} billets normaux ({{prixNormal}}), {{nbReduit}} billets réduits ({{prixReduit}})</p>
                    <p class="sous-total">Sous-total : {{sousTotal}}</p>
                    <button type="button" class="btn-retirer" data-retirer="{{soireeId}}">Retirer cette soirée</button>
                </article>
                {{/each}}
                <p class="total">Total : {{total}}</p>
                <button type="button" id="btn-vider-panier">Vider le panier</button>
            {{/if}}
        </script>
    </main>

    <footer class="pied">
        <p>NRV.net - Billetterie du festival</p>
    </footer>
</body>

</html>
