<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NRV.net - Connexion / inscription</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/handlebars@4.7.8/dist/handlebars.min.js"></script>
    <script type="module" src="js/auth-header.js"></script>
</head>
<body>
    <header class="entete">
        <h1>Nancy Rock Vibration</h1>
        <button type="button" id="btn-menu">Menu</button>
        <nav class="Navigation" id="nav"></nav>
    </header>
    
    <main>
        <h2 id="titre-spectacles">Connexion / inscription</h2>
        <div class="auth-card">
            <div id="alert-box" class="alert"></div>

            <div class="tabs">
                <button id="btn-connexion" class="tab-btn active" type="button">Connexion</button>
                <button id="btn-inscription" class="tab-btn" type="button">Inscription</button>
            </div>

            <!-- Formulaire de Connexion -->
            <form id="form-connexion">
                <div class="form-group">
                    <label for="c-email">Email</label>
                    <input type="email" id="c-email" name="email" required placeholder="nom@exemple.com">
                </div>
                <div class="form-group">
                    <label for="c-motDePasse">Mot de passe</label>
                    <input type="password" id="c-motDePasse" name="motDePasse" required>
                </div>
                <button type="submit">Se connecter</button>
            </form>

            <!-- Formulaire d'Inscription -->
            <form id="form-inscription" class="hidden">
                <div class="form-group">
                    <label for="r-nom">Nom</label>
                    <input type="text" id="r-nom" name="nom" required>
                </div>
                <div class="form-group">
                    <label for="r-prenom">Prénom</label>
                    <input type="text" id="r-prenom" name="prenom" required>
                </div>
                <div class="form-group">
                    <label for="r-email">Email</label>
                    <input type="email" id="r-email" name="email" required placeholder="nom@exemple.com">
                </div>
                <div class="form-group">
                    <label for="r-telephone">Téléphone</label>
                    <input type="tel" id="r-telephone" name="telephone" required placeholder="0600000000">
                </div>
                <div class="form-group">
                    <label for="r-motDePasse">Mot de passe</label>
                    <input type="password" id="r-motDePasse" name="motDePasse" required minlength="8">
                </div>
                <button type="submit">Créer un compte</button>
            </form>
        </div>
    </main>
    
<footer class="pieddepage">
    <p>NRV.net - Billetterie du festival</p>
</footer>

<script type="module" src="js/auth.js"></script>
</body>
</html>
