<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NRV.net - Détail d'une soirée</title>
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/soiree.js"></script>
    <script type="module" src="js/auth-header.js"></script>
</head>
<body>
    <header>
        <h1>Nancy Rock Vibration</h1>
        <button type="button" id="btn-menu">Menu</button>
        <nav class="Navigation" id="nav"></nav>
    </header>

    <main>
        <p id="message" class="message" role="status">Chargement de la soirée...</p>
        <div id="detail-soiree"></div>

        <script id="tpl-soiree" type="text/x-handlebars-template">
            <article>
                <div class="soiree-infos">
                    <h2>{{nom}}</h2>
                    <p>Thématique de la soirée : {{thematique}}</p>
                    <p>{{dateFormatee}} • Début : {{horaire}} • Lieu : {{lieu}}</p>
                    <p>Tarifs : normal {{prixNormalFormate}} • réduit {{prixReduitFormate}}</p>
                </div>
                <div class="soiree-page"> 
                    <section class="spectacles">
                        <h3>Spectacles de la soirée</h3>
                        <div id="liste-detail-spectacles">
                            {{#each spectacles}}
                            <article>
                                <div>
                                    {{#if video}}
                                    <div class="video">
                                        {{#if urlVideoIntegree}}
                                        <iframe src="{{urlVideoIntegree}}" title="Vidéo : {{titre}}" loading="lazy" allowfullscreen></iframe>
                                        {{/if}}
                                    </div>
                                    {{/if}}
                                </div>

                                <div>
                                    <h4>{{titre}}</h4>
                                    <p class="artiste">{{artistes}} ({{style}})</p>
                                    <p class="description">{{description}}</p>
                                </div>                                
                            </article>
                            {{/each}}
                        </div>
                    </section>
                
                    <aside class="billetterie">
                        <h3>Tarifs et billets</h3>
                        <div class="tarif">
                            <label for="nb-normal">Nombre de billets • Normal ({{prixNormalFormate}})</label>
                            <div class="quantite">
                                <button type="button" class="moins">-</button>
                                <input type="number" id="nb-normal" min="0" max="10" value="0">
                                <button type="button" class="plus">+</button>
                            </div>
                        </div>
                        <div class="tarif">
                            <label for="nb-normal">Nombre de billets • Réduit ({{prixReduitFormate}})</label>
                            <div class="quantite">
                                <button type="button" class="moins">-</button>
                                <input type="number" id="nb-reduit" min="0" max="10" value="0">
                                <button type="button" class="plus">+</button>
                            </div>
                            <p>Tarif réduit : Étudiants, moins de 18 ans, demandeurs d'emploi (justificatif à l'entrée)</p>
                        </div>
                        <button type="button" id="btn-ajouter" class="btn-principal">Ajouter au panier</button>
                        <p class="message" id="msg-panier" role="status"></p>
                    </aside>
                </div>
            </article>
        </script>

    </main>

    <footer class="pieddepage">
        <p>NRV.net - Billetterie du festival</p>
    </footer>
</body>
</html>
