<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NRV.net - Détail d'une soirée</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://cdn.jsdelivr.net/npm/handlebars@4.7.8/dist/handlebars.min.js"></script>
    <script type="module" src="js/soiree.js"></script>
</head>
<body>
    <header class="entete">
        <h1>Nancy Rock Vibration</h1>
        <p>Détail d'une soirée</p>
    </header>

    <main>
        <nav class="Navigation">
            <a href="index.html">Programme</a>
            <a href="panier.html">Panier</a>
        </nav>
        <p id="message" class="message" role="status">Chargement de la soirée...</p>
        <div id="detail-soiree"></div>

        <script id="tpl-soiree" type="text/x-handlebars-template">
            <article class="soiree">
                <header>
                    <h2>{{nom}}</h2>
                    <p>{{thematique}}</p>
                </header>
                <div>
                    <h3>Informations</h2>
                    <p>Date : {{dateFormatee}}</p>
                    <p>Heure : {{horaire}} </p>
                    <p>Lieu : {{lieu}}</p>
                </div>
                <section>
                    <h3>Tarifs et billets</h3>
                    <ul class="achat">
                        <li>
                            <label for="nb-normal">Normal : {{prixNormalFormate}}</label>
                            <input type="number" id="nb-normal" min="0" max="10" value="1">
                        </li>
                        <li>
                            <label for="nb-reduit">Réduit : {{prixReduitFormate}}
                                <p>(étudiants, demandeurs d'emploi, personnes en situation de handicap)</p>
                            </label>
                            <input type="number" id="nb-reduit" min="0" max="10" value="0">
                        </li>
                    </ul>
                    <button type="button" id="btn-ajouter">Ajouter au panier</button>
                    <p class="message" id="msg-panier" role="status"></p>
                </section>
                <section>
                    <h3>Spectacles de la soirée</h3>
                    <div id="liste-detail-spectacles">
                        {{#each spectacles}}
                        <article>
                            <h4>{{titre}}</h4>
                            <p class="artiste">{{artistes}} ({{style}})</p>
                            <p class="description">{{description}}</p>
                            {{#if video}}
                            <div class="video">
                                {{#if urlVideoIntegree}}
                                <iframe src="{{urlVideoIntegree}}" title="Vidéo : {{titre}}" loading="lazy" allowfullscreen></iframe>
                                {{/if}}
                                <p><a href="{{video}}" target="_blank" rel="noopener">Voir la vidéo</a></p>
                            </div>
                            {{/if}}
                        </article>
                        {{/each}}
                    </div>
                </section>
            </article>
        </script>

    </main>

    <footer class="pieddepage">
        <p>NRV.net - Billetterie du festival</p>
    </footer>
</body>
</html>
